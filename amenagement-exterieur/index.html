.f input,.f select{width:100%;padding:10px;border:1px solid #cfd8e6;border-radius:9px;background:#fff}
.product-picker{border:1px solid #e3e8f1;border-radius:12px;padding:12px;background:#fbfcfe}.product-search{margin-bottom:7px}.picker-meta{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#6f7c90;margin-top:4px}

.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.checks label{border:1px solid #e1e6ef;padding:9px;border-radius:9px;font-size:12px}
.nav{display:flex;justify-content:space-between;margin-top:18px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800}.primary{background:#2563eb;color:#fff}.ghost{background:#fff;border:1px solid #d6deea}.btn:disabled{opacity:.45}

.block{background:#fff1f1;border:1px solid #f1b1b1;color:#8d2020;border-radius:11px;padding:12px;margin:12px 0}.ok{background:#effbf3;border:1px solid #a7ddba;color:#176c3b;border-radius:11px;padding:12px;margin:12px 0;font-weight:800}

 if(S.step===0)return `<div class="panel" data-speedarti-tag="${T.type}"><h2>Quel ouvrage souhaitez-vous chiffrer ? ${tag(T.type)}</h2><div class="cards">${Object.entries(types).map(([id,x])=>`<button class="card ${S.type===id?'on':''}" data-type="${id}" data-speedarti-tag="${T.type}"><b>${x[0]}</b><small>${x[1]}</small></button>`).join('')}</div><label class="f" style="margin-top:14px" data-speedarti-tag="${T.nom}"><span>Nom du chiffrage${tag(T.nom)}</span><input data-text="nom" value="${esc(S.nom)}"></label></div>`;
 if(S.step===1){if(!S.type)return `<div class="panel block">Choisissez d’abord un type d’ouvrage.</div>`;return `<div class="panel"><h2>Dimensions</h2><div class="grid">${terr()?field('Longueur','L','m',T.L)+field('Largeur','l','m',T.l)+derived('Surface',surface(),'m²',T.surface):field('Longueur','LC','m',T.LC)+field('Hauteur','HC','m',T.HC)+(['cloture_lames','ganivelle','retenue_terre'].includes(S.type)?field('Espacement poteaux/piquets','EP','m',T.EP):'')}</div></div>`;}
 if(S.step===2){if(!S.type)return `<div class="panel block">Choisissez d’abord un type d’ouvrage.</div>`;let h='';if(S.type==='terrasse_bois'||S.type==='terrasse_composite'){h+=picker('rev','Lame / revêtement',S.type==='terrasse_composite'?'terrace_lame_composite':'terrace_lame_bois','AMEXT.CATALOGUE.LAME.REF')+picker('lamb','Lambourde','lambourde','AMEXT.CATALOGUE.LAMBOURDE.REF')+picker('fix','Fixation terrasse','terrace_fix','AMEXT.CATALOGUE.FIXATION.REF');}
 else if(S.type==='terrasse_dalles'){h+=`<label class="f" data-speedarti-tag="AMEXT.CATALOGUE.DALLE.HORS_BASE"><span>Référence dalle hors base${tag('AMEXT.CATALOGUE.DALLE.HORS_BASE')}</span><input data-text="refDalle" value="${esc(S.refDalle)}"></label>`+field('Prix dalle','priceDalle','€ HT/m²','AMEXT.PRIX.MANUEL.DALLE')+field('Longueur dalle','dalleL','mm','AMEXT.CATALOGUE.DALLE.LONGUEUR')+field('Largeur dalle','dalleW','mm','AMEXT.CATALOGUE.DALLE.LARGEUR')+field('Nombre exact de dalles (calepinage)','nbDalles','pièces',T.nbDalles);}
 else if(S.type==='cloture_panneaux'||S.type==='occultation')h+=picker('pan','Panneau / claustra','fence_panel','AMEXT.CATALOGUE.PANNEAU.REF')+picker('post','Poteau','fence_post','AMEXT.CATALOGUE.POTEAU.REF')+picker('ffix','Fixation','fence_fix','AMEXT.CATALOGUE.FIXATION.REF');
 else if(S.type==='cloture_lames')h+=picker('flame','Lame','fence_lame','AMEXT.CATALOGUE.LAME.REF')+picker('post','Poteau','fence_post','AMEXT.CATALOGUE.POTEAU.REF')+picker('ffix','Fixation','fence_fix','AMEXT.CATALOGUE.FIXATION.REF');
 else if(S.type==='ganivelle')h+=picker('gan','Ganivelle','ganivelle','AMEXT.CATALOGUE.GANIVELLE.REF')+picker('structure','Piquets','ganivelle_post','AMEXT.CATALOGUE.STRUCTURE.REF');
 else if(S.type==='retenue_terre')h+=picker('structure','Bois / traverses','retaining_board','AMEXT.CATALOGUE.STRUCTURE.REF')+picker('post','Poteaux / pieux','retaining_post','AMEXT.CATALOGUE.POTEAU.REF');
 return `<div class="panel"><h2>Matériaux</h2><div class="catalog-note"><b>Catalogue Idéa Bois : ${C.length} références</b><span>La recherche reste limitée aux références compatibles avec le poste. Une référence incompatible est bloquée.</span></div><div class="grid">${h}</div></div>`;}
 if(S.step===3){

   let grid=`<label class="f" data-speedarti-tag="${T.sup}"><span>Support${tag(T.sup)}</span><select data-sel="support"><option value="">— Choisir —</option><option value="plots">Plots</option><option value="dalle">Dalle béton</option><option value="sol_stabilise">Sol stabilisé</option></select></label><label class="f" data-speedarti-tag="${T.pose}"><span>Pose${tag(T.pose)}</span><select data-sel="pose"><option value="">— Choisir —</option><option value="droite">Droite</option><option value="decalee_1_2">Décalée 1/2</option><option value="decalee_1_3">Décalée 1/3</option><option value="diagonale">Diagonale</option></select></label>`;
   if(S.type!=='terrasse_dalles'){
    grid+=field('Entraxe lambourdes','EL','cm',T.EL);

   if(S.type!=='terrasse_dalles'){

   }
  }
  let extras='';if(terr())extras+=`<div class="grid"><label class="f" data-speedarti-tag="${T.prepMode}"><span>Préparation terrain${tag(T.prepMode)}</span><select data-sel="prepMode"><option value="aucune">Aucune</option><option value="mecanique">Mécanisée</option><option value="manuelle">Manuelle</option></select></label>${S.prepMode==='mecanique'?`<label class="f" data-speedarti-tag="${T.decap}"><span>Décaissement${tag(T.decap)}</span><select data-sel="decap"><option value="aucun">Aucun</option><option value="25">≈ 25 cm</option><option value="45">≈ 45 cm</option></select></label>`:''}</div>`;if(terr()&&S.prepMode==='mecanique')extras+=`<div class="checks">${checkbox('compact','Compactage',T.compact)}</div>`;if(terr()&&S.prepMode==='manuelle')extras+=field('Préparation manuelle','heuresPrepManuelle','h',T.prepManual);extras+=`<div class="checks">${terr()?checkbox('geo','Géotextile',T.geo):''}${['cloture_panneaux','cloture_lames','occultation'].includes(S.type)?checkbox('scel','Scellement',T.scel):''}${checkbox('depose','Dépose',T.depose)}${checkbox('evac','Évacuation / chargement',T.evac)}${checkbox('acces','Accès difficile',T.acces)}${checkbox('pente','Terrain en pente',T.pente)}${S.type==='terrasse_dalles'&&S.dalleL===600&&S.dalleW===600?checkbox('dalleRenforce','Soutien renforcé 60×60',T.dalleRenforce):''}</div>`;

  if(S.type==='cloture_lames')extras+=field('Fixations exactes par m²','fixParM2','u/m²',T.fixM2);
  if(terr()&&S.geo)extras+=field('Prix géotextile','priceGeo','€ HT/m²','AMEXT.PRIX.MANUEL.GEOTEXTILE');
  if(['cloture_panneaux','cloture_lames','occultation'].includes(S.type)&&S.scel)extras+=field('Volume scellement par poteau','volScelParPoteau','m³/poteau',T.volScel)+field('Prix scellement','priceScel','€ HT/m³','AMEXT.PRIX.MANUEL.SCELLEMENT');
  if(S.depose){let opts=S.type==='terrasse_dalles'?'<option value="dallage_sable">Dallage sur sable — 0,35 h/m²</option><option value="dallage_scelle">Dallage scellé — 0,95 h/m²</option>':(!terr()?'<option value="cloture_echalas">Clôture bois type échalas — 0,05 h/ml</option><option value="cloture_lisses">Clôture bois à lisses — 0,08 h/ml</option>':'');extras+=`<label class="f" data-speedarti-tag="${T.deposeType}"><span>Type de dépose${tag(T.deposeType)}</span><select data-sel="deposeType"><option value="manuel">Saisie manuelle contrôlée</option>${opts}</select></label>`;if(S.deposeType==='manuel')extras+=field('Heures de dépose','heuresDepose','h',T.heuresDepose);}if(S.evac)extras+=field('Heures chargement / évacuation','heuresEvac','h',T.heuresEvac);if(S.acces)extras+=field('Surtemps accès difficile','heuresAcces','h',T.heuresAcces);if(S.pente)extras+=field('Surtemps terrain en pente','heuresPente','h',T.heuresPente);
  return `<div class="panel"><h2>Options</h2>${terraceOpts}${extras}</div>`;
 }
 if(S.step===4){if(!S.type)return `<div class="panel block">Choisissez d’abord un type d’ouvrage.</div>`;const rk=neededRateKeys();let manual='';if(S.type==='terrasse_bois'&&S.support&&S.support!=='plots')manual+=field('Barème structure manuel','barStructManuel','h/m²',T.barStruct);if(S.type==='terrasse_bois'&&get('rev')&&!(get('rev').pieceWidthM>=.115))manual+=field('Barème pose manuel','barPoseManuel','h/m²',T.barPose);if(S.type==='terrasse_dalles'&&!supportedDalleBar().def)manual+=field('Barème pose manuel','barPoseManuel','h/m²',T.barPose);if(['cloture_panneaux','cloture_lames','occultation','ganivelle'].includes(S.type)&&((S.type==='cloture_panneaux'&&(!S.scel||S.HC>2))||(S.type==='cloture_lames'&&(!S.scel||S.HC>1.96))||(S.type==='occultation'&&(S.HC>1.93||S.scel))||(S.type==='ganivelle'&&S.HC>2)))manual+=field('Barème pose manuel','barPoseManuel','h/ml',T.barPose);if(S.type==='retenue_terre'&&!retentionBar(S.HC))manual+=field('Barème structure manuel','barStructManuel','h/ml',T.barStruct);const rateFields=rk.map(k=>field(k==='prep'?'Taux préparation / dépose':k==='str'?'Taux structure':'Taux pose',k,'€/h',T[k])).join('');return `<div class="panel"><h2>Main-d’œuvre</h2><div class="catalog-note"><div><b>Barèmes métier documentés — heures-personne</b><span>${esc(BAREME.source)}</span></div></div><div class="grid">${field('Ouvriers','ouv','pers.',T.ouv)}${rateFields}${manual}</div><div class="warn">Les accès difficiles, pentes, préparations manuelles et évacuations sont ajoutés en heures séparées : aucun coefficient automatique caché.</div></div>`;}
 return `<div class="panel"><h2>Résultats</h2><div class="metrics"><div class="metric"><small>Matériaux HT</small><b>${money(R.mt)}</b></div><div class="metric"><small>MO HT</small><b>${money(R.lt)}</b></div><div class="metric"><small>Total HT</small><b>${money(R.ht)}</b></div><div class="metric"><small>Total TTC</small><b>${money(R.ttc)}</b></div></div>${R.ok?'<div class="ok">✓ Contrôle balises + données obligatoires : conforme.</div>':`<div class="block"><b>⛔ ${blockers.length} blocage(s)</b><ul>${blockers.map(x=>`<li><code>${x[0]}</code> — ${x[1]}</li>`).join('')}</ul></div>`}<table><thead><tr><th>Désignation</th><th>Besoin calculé</th><th>Achat réel</th><th>Tarif fournisseur</th><th>Total HT</th><th>Source / contrôle unité</th></tr></thead><tbody>${R.mats.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.needQty} ${x.needUnit}</td><td>${x.purchaseQty} ${esc(x.purchaseUnit)}</td><td>${money(x.price)} / ${esc(x.priceUnit)}</td><td>${money(x.total)}</td><td>${esc(x.src)}${x.purchaseNote?`<div class="purchase-note">${esc(x.purchaseNote)}</div>`:''}${x.unitAudit?`<div class="purchase-note">Audit : ${esc(x.unitAudit)}</div>`:''}</td></tr>`).join('')}</tbody></table><h3>Main-d’œuvre détaillée</h3><table><thead><tr><th>Prestation</th><th>Barème / base</th><th>Heures-personne</th><th>Taux</th><th>Total HT</th><th>Source</th></tr></thead><tbody>${R.labor.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.bar?`${x.baseQty} ${esc(x.baseUnit)} × ${x.bar} h/${esc(x.baseUnit)}`:`${x.h} h saisies`}</td><td>${x.h} h</td><td>${money(x.rate)}/h</td><td>${money(x.total)}</td><td>${esc(x.source||'—')}</td></tr>`).join('')}</tbody></table><h3>Traçabilité complète des balises</h3>${R.tr.map(x=>`<div class="trace"><code>${x[0]}</code><span>${esc(x[1])}</span><b>${x[2]}</b></div>`).join('')}<p>Heures-personne : <b>${R.hours} h</b> • Durée équipe : <b>${R.dur} h</b></p><button class="btn primary" ${R.ok?'':'disabled'} id="quote">Mettre à jour le devis</button></div>`;
}
function updateSearch(el){const key=el.dataset.searchFor,cat=el.dataset.cat,q=el.value,select=document.querySelector(`[data-prod="${key}"]`),current=S.sel[key]||'',a=prod(cat,q);if(!select)return;select.innerHTML=`<option value="">— Référence exacte compatible —</option>${a.map(x=>`<option value="${x.code}" ${x.code===current?'selected':''}>${esc(x.code)} — ${esc(x.name)} — ${x.price?money(x.price):'PRIX MANQUANT'} HT/${esc(x.unit)}</option>`).join('')}`;const meta=select.closest('.product-picker')?.querySelector('.picker-meta span:first-child');if(meta)meta.textContent=`${a.length} référence(s) compatible(s) trouvée(s)`;}
function render(){const R=calc();$('#app').innerHTML=`<header class="top"><a href="../" class="logo" style="text-decoration:none">S</a><div class="brand">SpeedArti<small>Chiffrage métier</small></div><b>Aménagement extérieur</b><span class="version">V6 — BARÈME MÉTIER</span><span class="badge">DÉMO GITHUB</span></header><main class="layout"><aside class="side"><h3>Aménagement extérieur</h3><div class="steps">${steps.map((x,i)=>`<button data-step="${i}" class="${S.step===i?'on':''}">${i+1}. ${x}</button>`).join('')}</div><div class="sum"><small>ESTIMATION</small><b>${money(R.ttc)}</b><span>${R.ok?'✓ Validable':`⛔ ${blockers.length} blocage(s)`}</span></div></aside><section class="work"><div class="head"><div><small>CHIFFRAGE MÉTIER</small><h1>${steps[S.step]}</h1></div><b>${S.step+1} / 6</b></div>${content(R)}<div class="nav"><button class="btn ghost" data-nav="-1" ${S.step===0?'disabled':''}>← Précédent</button>${S.step<5?'<button class="btn primary" data-nav="1">Continuer →</button>':''}</div><a href="../" class="home">← Retour aux métiers</a></section></main>`;bind();}
function bind(){
 $('[data-sel="support"]')&&($('[data-sel="support"]').value=S.support);$('[data-sel="pose"]')&&($('[data-sel="pose"]').value=S.pose);$('[data-sel="prepMode"]')&&($('[data-sel="prepMode"]').value=S.prepMode);$('[data-sel="decap"]')&&($('[data-sel="decap"]').value=S.decap);$('[data-sel="deposeType"]')&&($('[data-sel="deposeType"]').value=S.deposeType);
 document.querySelectorAll('[data-step]').forEach(e=>e.onclick=()=>{S.step=+e.dataset.step;render()});document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=()=>{S.step=Math.max(0,Math.min(5,S.step+ +e.dataset.nav));render()});document.querySelectorAll('[data-type]').forEach(e=>e.onclick=()=>{S.type=e.dataset.type;S.sel={};S.L=0;S.l=0;S.LC=0;S.HC=0;S.EP=0;S.EL=0;S.EPlot=0;S.jeu=0;S.support='';S.pose='';S.perteValidee=false;S.pertePct=0;S.nbDalles=0;S.nbPlotsDalles=0;S.geo=false;S.scel=false;S.depose=false;S.acces=false;S.pente=false;S.heuresDepose=0;S.volScelParPoteau=0;S.fixParPanneau=0;S.fixParM2=0;S.price.geo=0;S.price.scel=0;S.price.dalle=0;S.refDalle='';S.dalleL=0;S.dalleW=0;S.ouv=0;S.prep=0;S.str=0;S.poseT=0;S.fin=0;S.barStructManuel=0;S.barPoseManuel=0;S.prepMode='aucune';S.decap='aucun';S.compact=false;S.heuresPrepManuelle=0;S.deposeType='manuel';S.evac=false;S.heuresEvac=0;S.heuresAcces=0;S.heuresPente=0;S.dalleRenforce=false;render()});
 document.querySelectorAll('[data-num]').forEach(e=>e.onchange=()=>{let k=e.dataset.num,v=+e.value;if(k==='priceGeo')S.price.geo=v;else if(k==='priceScel')S.price.scel=v;else if(k==='priceDalle')S.price.dalle=v;else S[k]=v;render()});document.querySelectorAll('[data-text]').forEach(e=>e.onchange=()=>{S[e.dataset.text]=e.value;render()});document.querySelectorAll('[data-prod]').forEach(e=>e.onchange=()=>{S.sel[e.dataset.prod]=e.value;render()});document.querySelectorAll('[data-sel]').forEach(e=>e.onchange=()=>{S[e.dataset.sel]=e.value;render()});document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{S[e.dataset.check]=e.checked;render()});document.querySelectorAll('[data-search-for]').forEach(e=>e.oninput=()=>updateSearch(e));$('#quote')&&($('#quote').onclick=()=>alert('Démo validée. En production, ce bouton appellera le pont devisIntegration SpeedArti.'));
}
render();
