if(S.scel&&['cloture_panneaux','cloture_lames','occultation'].includes(S.type)){mats.push({id:'scel',name:'Béton / mortier de scellement',qty:r(posts*.025),unit:'m³',price:S.price.scel,total:r(posts*.025*S.price.scel),src:'Prix manuel contrôlé',formula:'poteaux × 0,025',tag:'AMEXT.PRIX.MANUEL.SCELLEMENT'});if(!(S.price.scel>0))blockers.push(['AMEXT.PRIX.MANUEL.SCELLEMENT','Prix de scellement obligatoire'])}}
const coef=(S.comp==='complexe'?1.25:S.comp==='simple'?.9:1)*(1+(S.acces?.15:0)+(S.pente?.15:0));const src=terr()?[[surface*.1,S.prep,'Préparation'],[surface*.22,S.str,'Structure'],[surface*.30,S.poseT,'Pose'],[surface*.08,S.fin,'Finitions']]:[[S.LC*.06,S.prep,'Implantation'],[(Math.ceil(S.LC/Math.max(.5,S.EP))+1)*.25,S.str,'Structure / poteaux'],[fs*.22,S.poseT,'Pose'],[S.LC*.06,S.fin,'Finitions']];src.forEach((x,i)=>labor.push({name:x[2],h:r(x[0]*coef),rate:x[1],total:r(x[0]*coef*x[1]),tag:['AMEXT.CALC.MO.PREPARATION','AMEXT.CALC.MO.STRUCTURE','AMEXT.CALC.MO.POSE','AMEXT.CALC.MO.FINITION'][i]}));if(S.depose){const h=r((terr()?surface*.15:S.LC*.12));labor.push({name:'Dépose existante',h,rate:S.prep,total:r(h*S.prep),tag:'AMEXT.CALC.MO.DEPOSE'})}if(S.ouv<1)blockers.push([T.ouv,'Nombre d’ouvriers minimum : 1']);[['prep','préparation'],['str','structure'],['poseT','pose'],['fin','finition']].forEach(([k,l])=>{if(!(S[k]>0))blockers.push([T[k],`Taux ${l} > 0 obligatoire`])});const mt=r(mats.reduce((a,x)=>a+x.total,0)),lt=r(labor.reduce((a,x)=>a+x.total,0)),ht=r(mt+lt),ttc=r(ht*1.2),hours=r(labor.reduce((a,x)=>a+x.h,0)),dur=r(hours/Math.max(1,S.ouv));mats.forEach(x=>tr.push([`AMEXT.QTE.${x.id.toUpperCase()}`,x.formula,x.price>0?'OK':'BLOCAGE']));labor.forEach(x=>tr.push([x.tag,`${x.h} h × ${x.rate} €/h`,x.rate>0?'OK':'BLOCAGE']));return{mats,labor,mt,lt,ht,ttc,hours,dur,tr,ok:blockers.length===0}}
const tag=t=>`<code class="tag">${t}</code>`;function field(label,key,unit,t){return `<label class="f" data-speedarti-tag="${t}"><span>${label}${tag(t)}</span><input type="number" data-num="${key}" value="${S[key]}" step="0.1">${unit?`<small>${unit}</small>`:''}</label>`}function picker(key,label,cat,t){const a=prod(cat),v=S.sel[key]||'';return `<label class="f" data-speedarti-tag="${t}"><span>${label}${tag(t)}</span><select data-prod="${key}"><option value="">— Référence exacte —</option>${a.map(x=>`<option value="${x.code}" ${x.code===v?'selected':''}>${esc(x.name)} — ${money(x.price)}</option>`).join('')}</select></label>`}
function content(R){if(S.step===0)return `<div class="panel"><h2>Quel ouvrage souhaitez-vous chiffrer ?</h2><div class="cards">${Object.entries(types).map(([id,x])=>`<button class="card ${S.type===id?'on':''}" data-type="${id}"><b>${x[0]}</b><small>${x[1]}</small></button>`).join('')}</div><label class="f" style="margin-top:14px" data-speedarti-tag="${T.nom}"><span>Nom du chiffrage${tag(T.nom)}</span><input data-text="nom" value="${esc(S.nom)}"></label></div>`;
if(S.step===1)return `<div class="panel"><h2>Dimensions</h2><div class="grid">${terr()?field('Longueur','L','m',T.L)+field('Largeur','l','m',T.l)+field('Surface','S','m²',T.S):field('Longueur','LC','m',T.LC)+field('Hauteur','HC','m',T.HC)+field('Espacement poteaux','EP','m',T.EP)}</div></div>`;
if(S.step===2){let h='';if(terr()){if(S.type==='terrasse_dalles')h+=`<label class="f"><span>Référence dalle hors base${tag('AMEXT.CATALOGUE.DALLE.HORS_BASE')}</span><input data-text="refDalle" value="${esc(S.refDalle)}"></label>`+field('Prix dalle','priceDalle','€ HT/m²','AMEXT.PRIX.MANUEL.DALLE');else h+=picker('rev','Lame / revêtement','terrace_lame','AMEXT.CATALOGUE.LAME.REF');h+=picker('lamb','Lambourde','lambourde','AMEXT.CATALOGUE.LAMBOURDE.REF');if(S.support==='plots')h+=picker('plot','Plot','plot','AMEXT.CATALOGUE.PLOT.REF');h+=picker('fix','Fixation terrasse','terrace_fix','AMEXT.CATALOGUE.FIXATION.REF')}else if(S.type==='cloture_panneaux'||S.type==='occultation')h+=picker('pan','Panneau / claustra','fence_panel','AMEXT.CATALOGUE.PANNEAU.REF')+picker('post','Poteau','post','AMEXT.CATALOGUE.POTEAU.REF')+picker('ffix','Fixation','fence_fix','AMEXT.CATALOGUE.FIXATION.REF');else if(S.type==='cloture_lames')h+=picker('flame','Lame','fence_lame','AMEXT.CATALOGUE.LAME.REF')+picker('post','Poteau','post','AMEXT.CATALOGUE.POTEAU.REF')+picker('ffix','Fixation','fence_fix','AMEXT.CATALOGUE.FIXATION.REF');else if(S.type==='ganivelle')h+=picker('gan','Ganivelle','ganivelle','AMEXT.CATALOGUE.GANIVELLE.REF')+picker('structure','Piquets','structure','AMEXT.CATALOGUE.STRUCTURE.REF');else h+=picker('structure','Bois / traverses','structure','AMEXT.CATALOGUE.STRUCTURE.REF')+picker('post','Poteaux / pieux','post','AMEXT.CATALOGUE.POTEAU.REF');return `<div class="panel"><h2>Matériaux Idea Bois</h2><p>Référence exacte + prix exact. Aucune moyenne automatique.</p><div class="grid">${h}</div></div>`}
if(S.step===3)return `<div class="panel"><h2>Options</h2>${terr()?`<div class="grid"><label class="f"><span>Support${tag(T.sup)}</span><select data-sel="support"><option value="plots">Plots</option><option value="dalle">Dalle béton</option><option value="sol_stabilise">Sol stabilisé</option></select></label><label class="f"><span>Pose${tag(T.pose)}</span><select data-sel="pose"><option value="droite">Droite</option><option value="decalee_1_2">Décalée 1/2</option><option value="decalee_1_3">Décalée 1/3</option><option value="diagonale">Diagonale</option></select></label>${field('Entraxe lambourdes','EL','cm',T.EL)}${S.support==='plots'?field('Entraxe plots','EPlot','cm',T.EPlot):''}${field('Jeu lames','jeu','mm',T.jeu)}</div>`:''}<div class="checks">${terr()?`<label><input type="checkbox" data-check="geo" ${S.geo?'checked':''}> Géotextile</label>`:''}${['cloture_panneaux','cloture_lames','occultation'].includes(S.type)?`<label><input type="checkbox" data-check="scel" ${S.scel?'checked':''}> Scellement</label>`:''}<label><input type="checkbox" data-check="depose" ${S.depose?'checked':''}> Dépose</label><label><input type="checkbox" data-check="acces" ${S.acces?'checked':''}> Accès difficile</label><label><input type="checkbox" data-check="pente" ${S.pente?'checked':''}> Terrain en pente</label></div>${S.geo?field('Prix géotextile','priceGeo','€ HT/m²','AMEXT.PRIX.MANUEL.GEOTEXTILE'):''}${S.scel&&!terr()?field('Prix scellement','priceScel','€ HT/m³','AMEXT.PRIX.MANUEL.SCELLEMENT'):''}</div>`;
if(S.step===4)return `<div class="panel"><h2>Main-d’œuvre</h2><div class="grid">${field('Ouvriers','ouv','pers.',T.ouv)}<label class="f"><span>Complexité${tag(T.comp)}</span><select data-sel="comp"><option value="simple">Simple</option><option value="moyenne">Moyenne</option><option value="complexe">Complexe</option></select></label>${field('Préparation','prep','€/h',T.prep)}${field('Structure','str','€/h',T.str)}${field('Pose','poseT','€/h',T.poseT)}${field('Finitions','fin','€/h',T.fin)}</div></div>`;
return `<div class="panel"><h2>Résultats</h2><div class="metrics"><div class="metric"><small>Matériaux HT</small><b>${money(R.mt)}</b></div><div class="metric"><small>MO HT</small><b>${money(R.lt)}</b></div><div class="metric"><small>Total HT</small><b>${money(R.ht)}</b></div><div class="metric"><small>Total TTC</small><b>${money(R.ttc)}</b></div></div>${R.ok?'<div class="ok">✓ Toutes les balises obligatoires sont satisfaites.</div>':`<div class="block"><b>⛔ ${blockers.length} blocage(s)</b><ul>${blockers.map(x=>`<li><code>${x[0]}</code> — ${x[1]}</li>`).join('')}</ul></div>`}<table><thead><tr><th>Désignation</th><th>Qté</th><th>PU HT</th><th>Total</th><th>Source</th></tr></thead><tbody>${R.mats.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty} ${x.unit}</td><td>${money(x.price)}</td><td>${money(x.total)}</td><td>${esc(x.src)}</td></tr>`).join('')}</tbody></table><h3>Balises</h3>${R.tr.map(x=>`<div class="trace"><code>${x[0]}</code><span>${x[1]}</span><b>${x[2]}</b></div>`).join('')}<p>Durée équipe : <b>${R.dur} h</b></p><button class="btn primary" ${R.ok?'':'disabled'} id="quote">Mettre à jour le devis</button></div>`}
function render(){const R=calc();$('#app').innerHTML=`<header class="top"><a href="../" class="logo" style="text-decoration:none">S</a><div class="brand">SpeedArti<small>Chiffrage métier</small></div><b>Aménagement extérieur</b><span class="badge">DÉMO GITHUB</span></header><main class="layout"><aside class="side"><h3>Aménagement extérieur</h3><div class="steps">${steps.map((x,i)=>`<button data-step="${i}" class="${S.step===i?'on':''}">${i+1}. ${x}</button>`).join('')}</div><div class="sum"><small>ESTIMATION</small><b>${money(R.ttc)}</b><span>${R.ok?'✓ Validable':`⛔ ${blockers.length} blocage(s)`}</span></div></aside><section class="work"><div class="head"><div><small>CHIFFRAGE MÉTIER</small><h1>${steps[S.step]}</h1></div><b>${S.step+1} / 6</b></div>${content(R)}<div class="nav"><button class="btn ghost" data-nav="-1" ${S.step===0?'disabled':''}>← Précédent</button>${S.step<5?'<button class="btn primary" data-nav="1">Continuer →</button>':''}</div><a href="../" class="home">← Retour aux métiers</a></section></main>`;bind()}
function bind(){$('[data-sel="support"]')&&($('[data-sel="support"]').value=S.support);$('[data-sel="pose"]')&&($('[data-sel="pose"]').value=S.pose);$('[data-sel="comp"]')&&($('[data-sel="comp"]').value=S.comp);document.querySelectorAll('[data-step]').forEach(e=>e.onclick=()=>{S.step=+e.dataset.step;render()});document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=()=>{S.step=Math.max(0,Math.min(5,S.step+ +e.dataset.nav));render()});document.querySelectorAll('[data-type]').forEach(e=>e.onclick=()=>{S.type=e.dataset.type;S.sel={};render()});document.querySelectorAll('[data-num]').forEach(e=>e.onchange=()=>{let k=e.dataset.num,v=+e.value;if(k==='priceGeo')S.price.geo=v;else if(k==='priceScel')S.price.scel=v;else if(k==='priceDalle')S.price.dalle=v;else{S[k]=v;if(k==='L'||k==='l')S.S=r(S.L*S.l)}render()});document.querySelectorAll('[data-text]').forEach(e=>e.onchange=()=>{S[e.dataset.text]=e.value;render()});document.querySelectorAll('[data-prod]').forEach(e=>e.onchange=()=>{S.sel[e.dataset.prod]=e.value;render()});document.querySelectorAll('[data-sel]').forEach(e=>e.onchange=()=>{S[e.dataset.sel]=e.value;render()});document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{S[e.dataset.check]=e.checked;render()});$('#quote')&&($('#quote').onclick=()=>alert('Démo validée. En production, ce bouton appellera le pont devisIntegration SpeedArti.'))}
render();
