*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}button,input,select{font:inherit}
.top{height:68px;background:#fff;border-bottom:1px solid #e1e6ef;display:flex;align-items:center;padding:0 22px;gap:14px;position:sticky;top:0;z-index:5}
.logo{width:38px;height:38px;border-radius:11px;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:900}
.brand{font-weight:800}.brand small{display:block;color:#7b8799;font-size:11px}.badge{margin-left:auto;background:#edf4ff;color:#2563eb;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 68px)}.side{background:#fff;border-right:1px solid #e1e6ef;padding:18px}.side h3{margin:0 0 16px}
.steps{display:grid;gap:7px}.steps button{border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;color:#647187}.steps button.on{background:#edf4ff;color:#2563eb;font-weight:800}
.sum{margin-top:20px;background:#f7f9fc;border-radius:12px;padding:12px}.sum b{display:block;font-size:20px}.work{padding:24px;max-width:1250px}.head{display:flex;justify-content:space-between;align-items:start}.head h1{margin:4px 0 18px}
.panel{background:#fff;border:1px solid #e1e6ef;border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card{border:1px solid #d9e1ec;background:#fff;border-radius:13px;padding:14px;text-align:left}.card.on{border-color:#2563eb;background:#f0f6ff}.card b{display:block;margin:6px 0}.card small{color:#708096}
.f{display:grid;gap:6px}.f span{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:12px}.tag{font:9px ui-monospace,monospace;background:#f0f3f7;color:#697791;padding:2px 4px;border-radius:4px}
.f input,.f select{width:100%;padding:10px;border:1px solid #cfd8e6;border-radius:9px;background:#fff}
.product-picker{border:1px solid #e3e8f1;border-radius:12px;padding:12px;background:#fbfcfe}.product-search{margin-bottom:7px}.picker-meta{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#6f7c90;margin-top:4px}
.catalog-note{display:flex;gap:10px;align-items:flex-start;background:#f3f7ff;border:1px solid #d6e4ff;border-radius:12px;padding:12px;margin-bottom:14px;font-size:12px}.catalog-note b{display:block}
.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.checks label{border:1px solid #e1e6ef;padding:9px;border-radius:9px;font-size:12px}
.nav{display:flex;justify-content:space-between;margin-top:18px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800}.primary{background:#2563eb;color:#fff}.ghost{background:#fff;border:1px solid #d6deea}.btn:disabled{opacity:.45}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{border:1px solid #e1e6ef;border-radius:12px;padding:12px}.metric small{color:#7b8799}.metric b{display:block;font-size:20px;margin-top:4px}
.block{background:#fff1f1;border:1px solid #f1b1b1;color:#8d2020;border-radius:11px;padding:12px;margin:12px 0}.ok{background:#effbf3;border:1px solid #a7ddba;color:#176c3b;border-radius:11px;padding:12px;margin:12px 0;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #e8edf3;text-align:left;vertical-align:top}th{background:#f6f8fb}.right{text-align:right}.trace{font-size:11px;border-bottom:1px solid #edf1f5;padding:7px 0;display:grid;grid-template-columns:1fr 1.5fr 70px;gap:8px}
.purchase-note{font-size:11px;color:#5f6e82;margin-top:3px}.warn{color:#8a5c00;background:#fff9e8;border:1px solid #f2d88d;border-radius:10px;padding:10px;margin:10px 0}
.version{background:#123c84;color:#fff;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900}.unitstats{font-size:11px;color:#53657d;margin-top:6px}.audit-good{color:#176c3b;font-weight:800}.home{display:inline-block;margin-top:14px;color:#2563eb;text-decoration:none;font-weight:800;font-size:12px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #e1e6ef}.steps{display:flex;overflow:auto}.steps button{min-width:130px}.cards{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.work{padding:14px}.grid,.cards,.checks,.metrics{grid-template-columns:1fr}.tag{display:none}}
</style>

   }
 }
 else {

   billedArea,total:r(total),src:`Idea Bois — ${p.code}`,formula,tag,purchaseNote:note,
   supplierUnit:p.unit,contentQty:cq,contentUnit:cu,unitAudit:p.unitAudit||''
 };

let blockers=[];
function calc(){
 blockers=[];
 const mats=[],labor=[],tr=[];
 const surface=r(S.S>0?S.S:S.L*S.l),fs=r(S.LC*S.HC);
 if(!S.nom.trim()) blockers.push([T.nom,'Nom du chiffrage obligatoire']);
 if(terr()){
   if(!(S.L>0)) blockers.push([T.L,'Longueur terrasse obligatoire pour les quantités structurelles']);
   if(!(S.l>0)) blockers.push([T.l,'Largeur terrasse obligatoire pour les quantités structurelles']);
   if(!(surface>0)) blockers.push([T.S,'Surface obligatoire']);
   const rev=get('rev'),lam=get('lamb'),plot=get('plot'),fix=get('fix');
   if(S.type==='terrasse_dalles'){
     if(rev) mats.push(makeMaterial('rev','Dalle',surface*loss(),'m²',rev,'surface × perte','AMEXT.CALC.TERRASSE.SURFACE_COMMANDE'));
     else if(S.price.dalle>0&&S.refDalle.trim()&&S.dalleL>0&&S.dalleW>0){
       const need=r(surface*loss()),area=r((S.dalleL/1000)*(S.dalleW/1000)),pieces=area>0?Math.ceil(need/area):0,billed=r(pieces*area);
       mats.push({id:'rev',name:'Dalle hors base — '+S.refDalle,needQty:need,needUnit:'m²',purchaseQty:pieces,purchaseUnit:'pièce(s)',price:S.price.dalle,priceUnit:'m²',billedArea:billed,total:r(billed*S.price.dalle),src:'Hors base contrôlé',formula:'surface × perte → arrondi dalle entière',tag:'AMEXT.CALC.TERRASSE.SURFACE_COMMANDE',purchaseNote:`${pieces} dalle(s) × ${area} m² = ${billed} m² facturés`,unitAudit:'dimensions et prix manuels contrôlés'});
     } else blockers.push(['AMEXT.CATALOGUE.DALLE.HORS_BASE','Référence, prix HT/m², longueur et largeur exactes de dalle obligatoires']);
   } else mats.push(makeMaterial('rev','Lames de terrasse',surface*loss(),'m²',rev,'surface × coefficient de perte','AMEXT.CATALOGUE.LAME.REF','Sélectionner une lame exacte'));
   const nL=Math.ceil(S.l/Math.max(.2,S.EL/100))+1,lml=nL*S.L*1.05;
   mats.push(makeMaterial('lamb','Lambourdes',lml,'ml',lam,'(ceil(largeur/entraxe)+1) × longueur × 1,05','AMEXT.CATALOGUE.LAMBOURDE.REF','Sélectionner une lambourde'));
   if(S.support==='plots'){
     const n=nL*(Math.ceil(S.L/Math.max(.3,S.EPlot/100))+1);
     mats.push(makeMaterial('plot','Plots',n,'u',plot,'nb lambourdes × supports','AMEXT.CATALOGUE.PLOT.REF','Sélectionner un plot'));
   }
   if(S.type!=='terrasse_dalles'){
     const bw=rev?+rev.pieceWidthM:0;
     if(!(bw>0)) blockers.push(['AMEXT.CALC.TERRASSE.LARGEUR_LAME','Largeur exacte de la lame obligatoire pour calculer les rangées et fixations']);
     const rows=bw>0?Math.ceil(S.l/(bw+S.jeu/1000)):0;
     const raw=rows>0?Math.ceil(nL*rows*2*1.05):0;
     mats.push(makeMaterial('fix','Fixations',raw,'u',fix,'rangées exactes selon largeur lame × croisements × 2 × 1,05','AMEXT.CATALOGUE.FIXATION.REF','Sélectionner une fixation'));
   }
   if(S.geo){
     {const q=r(surface*1.1);mats.push({id:'geo',name:'Géotextile',needQty:q,needUnit:'m²',purchaseQty:q,purchaseUnit:'m²',price:S.price.geo,priceUnit:'m²',total:r(q*S.price.geo),src:'Prix manuel contrôlé',formula:'surface × 1,10',tag:'AMEXT.PRIX.MANUEL.GEOTEXTILE',purchaseNote:'Quantité et prix saisis/calculés au m² ; aucun conditionnement fournisseur imposé',unitAudit:'unité manuelle m²'});}
     if(!(S.price.geo>0)) blockers.push(['AMEXT.PRIX.MANUEL.GEOTEXTILE','Prix géotextile obligatoire']);
   }
 } else {
   if(!(S.LC>0)) blockers.push([T.LC,'Longueur obligatoire']);
   if(!(S.HC>0)) blockers.push([T.HC,'Hauteur obligatoire']);
   const posts=Math.ceil(S.LC/Math.max(.5,S.EP))+1;
   if(S.type==='cloture_panneaux'||S.type==='occultation'){
     const pan=get('pan'),span=pan?+pan.spanM:0;
     if(!(span>0)) blockers.push(['AMEXT.CALC.CLOTURE.LARGEUR_PANNEAU','Largeur exacte du panneau obligatoire']);
     mats.push(makeMaterial('pan','Panneau / claustra',span>0?Math.ceil(S.LC/span):0,'u',pan,'ceil(longueur / largeur exacte panneau)','AMEXT.CATALOGUE.PANNEAU.REF','Sélectionner un panneau'));
     mats.push(makeMaterial('post','Poteaux',posts,'u',get('post'),'ceil(longueur/espacement)+1','AMEXT.CATALOGUE.POTEAU.REF','Sélectionner un poteau'));
     mats.push(makeMaterial('fix','Fixations',posts*2,'u',get('ffix'),'poteaux × 2','AMEXT.CATALOGUE.FIXATION.REF','Sélectionner une fixation'));
   }
   if(S.type==='cloture_lames'){
     mats.push(makeMaterial('lame','Lames de clôture',fs*1.08,'m²',get('flame'),'surface × 1,08','AMEXT.CATALOGUE.LAME.REF','Sélectionner une lame'));
     mats.push(makeMaterial('post','Poteaux',posts,'u',get('post'),'ceil(longueur/espacement)+1','AMEXT.CATALOGUE.POTEAU.REF','Sélectionner un poteau'));
     mats.push(makeMaterial('fix','Fixations',Math.ceil(fs*12*1.05),'u',get('ffix'),'surface × 12 × 1,05','AMEXT.CATALOGUE.FIXATION.REF','Sélectionner une fixation'));
   }
   if(S.type==='ganivelle'){
     mats.push(makeMaterial('gan','Ganivelle',S.LC,'ml',get('gan'),'longueur clôture → conditionnement ml exact','AMEXT.CATALOGUE.GANIVELLE.REF','Sélectionner une ganivelle'));
     mats.push(makeMaterial('str','Piquets',posts,'u',get('structure'),'ceil(longueur/espacement)+1','AMEXT.CATALOGUE.STRUCTURE.REF','Sélectionner des piquets'));
   }
   if(S.type==='retenue_terre'){
     mats.push(makeMaterial('str','Bois / traverses',fs*1.05,'m²',get('structure'),'longueur × hauteur × 1,05','AMEXT.CATALOGUE.STRUCTURE.REF','Sélectionner le bois'));
     mats.push(makeMaterial('post','Poteaux / pieux',posts,'u',get('post'),'ceil(longueur/espacement)+1','AMEXT.CATALOGUE.POTEAU.REF','Sélectionner les pieux'));
   }
   if(S.scel&&['cloture_panneaux','cloture_lames','occultation'].includes(S.type)){
     {const q=r(posts*.025);mats.push({id:'scel',name:'Béton / mortier de scellement',needQty:q,needUnit:'m³',purchaseQty:q,purchaseUnit:'m³',price:S.price.scel,priceUnit:'m³',total:r(q*S.price.scel),src:'Prix manuel contrôlé',formula:'poteaux × 0,025',tag:'AMEXT.PRIX.MANUEL.SCELLEMENT',purchaseNote:'Quantité et prix contrôlés au m³',unitAudit:'unité manuelle m³'});}
     if(!(S.price.scel>0)) blockers.push(['AMEXT.PRIX.MANUEL.SCELLEMENT','Prix de scellement obligatoire']);
   }
 }
 const coef=(S.comp==='complexe'?1.25:S.comp==='simple'?.9:1)*(1+(S.acces?.15:0)+(S.pente?.15:0));
 const src=terr()?[[surface*.1,S.prep,'Préparation'],[surface*.22,S.str,'Structure'],[surface*.30,S.poseT,'Pose'],[surface*.08,S.fin,'Finitions']]:[[S.LC*.06,S.prep,'Implantation'],[(Math.ceil(S.LC/Math.max(.5,S.EP))+1)*.25,S.str,'Structure / poteaux'],[fs*.22,S.poseT,'Pose'],[S.LC*.06,S.fin,'Finitions']];
 src.forEach((x,i)=>labor.push({name:x[2],h:r(x[0]*coef),rate:x[1],total:r(x[0]*coef*x[1]),tag:['AMEXT.CALC.MO.PREPARATION','AMEXT.CALC.MO.STRUCTURE','AMEXT.CALC.MO.POSE','AMEXT.CALC.MO.FINITION'][i]}));
 if(S.depose){const h=r((terr()?surface*.15:S.LC*.12));labor.push({name:'Dépose existante',h,rate:S.prep,total:r(h*S.prep),tag:'AMEXT.CALC.MO.DEPOSE'})}
 if(S.ouv<1) blockers.push([T.ouv,'Nombre d’ouvriers minimum : 1']);
 [['prep','préparation'],['str','structure'],['poseT','pose'],['fin','finition']].forEach(([k,l])=>{if(!(S[k]>0))blockers.push([T[k],`Taux ${l} > 0 obligatoire`])});
 const mt=r(mats.reduce((a,x)=>a+x.total,0)),lt=r(labor.reduce((a,x)=>a+x.total,0)),ht=r(mt+lt),ttc=r(ht*1.2),hours=r(labor.reduce((a,x)=>a+x.h,0)),dur=r(hours/Math.max(1,S.ouv));
 mats.forEach(x=>tr.push([`AMEXT.QTE.${x.id.toUpperCase()}`,`${x.formula} • besoin ${x.needQty} ${x.needUnit} • achat ${x.purchaseQty} ${x.purchaseUnit}`,x.price>0&&x.total>=0?'OK':'BLOCAGE']));
 labor.forEach(x=>tr.push([x.tag,`${x.h} h × ${x.rate} €/h`,x.rate>0?'OK':'BLOCAGE']));
 return{mats,labor,mt,lt,ht,ttc,hours,dur,tr,ok:blockers.length===0};
}
const tag=t=>`<code class="tag">${t}</code>`;

     h+=picker('fix','Fixation terrasse','terrace_fix','AMEXT.CATALOGUE.FIXATION.REF');
   } else if(S.type==='cloture_panneaux'||S.type==='occultation') h+=picker('pan','Panneau / claustra','fence_panel','AMEXT.CATALOGUE.PANNEAU.REF')+picker('post','Poteau','post','AMEXT.CATALOGUE.POTEAU.REF')+picker('ffix','Fixation','fence_fix','AMEXT.CATALOGUE.FIXATION.REF');
   else if(S.type==='cloture_lames') h+=picker('flame','Lame','fence_lame','AMEXT.CATALOGUE.LAME.REF')+picker('post','Poteau','post','AMEXT.CATALOGUE.POTEAU.REF')+picker('ffix','Fixation','fence_fix','AMEXT.CATALOGUE.FIXATION.REF');
   else if(S.type==='ganivelle') h+=picker('gan','Ganivelle','ganivelle','AMEXT.CATALOGUE.GANIVELLE.REF')+picker('structure','Piquets','structure','AMEXT.CATALOGUE.STRUCTURE.REF');
   else h+=picker('structure','Bois / traverses','structure','AMEXT.CATALOGUE.STRUCTURE.REF')+picker('post','Poteaux / pieux','post','AMEXT.CATALOGUE.POTEAU.REF');
   return `<div class="panel"><h2>Matériaux Idéa Bois</h2>

 }
 if(S.step===3)return `<div class="panel"><h2>Options</h2>${terr()?`<div class="grid"><label class="f"><span>Support${tag(T.sup)}</span><select data-sel="support"><option value="plots">Plots</option><option value="dalle">Dalle béton</option><option value="sol_stabilise">Sol stabilisé</option></select></label><label class="f"><span>Pose${tag(T.pose)}</span><select data-sel="pose"><option value="droite">Droite</option><option value="decalee_1_2">Décalée 1/2</option><option value="decalee_1_3">Décalée 1/3</option><option value="diagonale">Diagonale</option></select></label>${field('Entraxe lambourdes','EL','cm',T.EL)}${S.support==='plots'?field('Entraxe plots','EPlot','cm',T.EPlot):''}${field('Jeu lames','jeu','mm',T.jeu)}</div>`:''}<div class="checks">${terr()?`<label><input type="checkbox" data-check="geo" ${S.geo?'checked':''}> Géotextile</label>`:''}${['cloture_panneaux','cloture_lames','occultation'].includes(S.type)?`<label><input type="checkbox" data-check="scel" ${S.scel?'checked':''}> Scellement</label>`:''}<label><input type="checkbox" data-check="depose" ${S.depose?'checked':''}> Dépose</label><label><input type="checkbox" data-check="acces" ${S.acces?'checked':''}> Accès difficile</label><label><input type="checkbox" data-check="pente" ${S.pente?'checked':''}> Terrain en pente</label></div>${S.geo?field('Prix géotextile','priceGeo','€ HT/m²','AMEXT.PRIX.MANUEL.GEOTEXTILE'):''}${S.scel&&!terr()?field('Prix scellement','priceScel','€ HT/m³','AMEXT.PRIX.MANUEL.SCELLEMENT'):''}</div>`;
 if(S.step===4)return `<div class="panel"><h2>Main-d’œuvre</h2><div class="grid">${field('Ouvriers','ouv','pers.',T.ouv)}<label class="f"><span>Complexité${tag(T.comp)}</span><select data-sel="comp"><option value="simple">Simple</option><option value="moyenne">Moyenne</option><option value="complexe">Complexe</option></select></label>${field('Préparation','prep','€/h',T.prep)}${field('Structure','str','€/h',T.str)}${field('Pose','poseT','€/h',T.poseT)}${field('Finitions','fin','€/h',T.fin)}</div></div>`;

 <h3>Balises</h3>${R.tr.map(x=>`<div class="trace"><code>${x[0]}</code><span>${x[1]}</span><b>${x[2]}</b></div>`).join('')}<p>Durée équipe : <b>${R.dur} h</b></p><button class="btn primary" ${R.ok?'':'disabled'} id="quote">Mettre à jour le devis</button></div>`;

function render(){

 $('#app').innerHTML=`<header class="top"><a href="../" class="logo" style="text-decoration:none">S</a><div class="brand">SpeedArti<small>Chiffrage métier</small></div><b>Aménagement extérieur</b><span class="version">V4 — UNITÉS CONTRÔLÉES</span><span class="badge">DÉMO GITHUB</span></header><main class="layout"><aside class="side"><h3>Aménagement extérieur</h3><div class="steps">${steps.map((x,i)=>`<button data-step="${i}" class="${S.step===i?'on':''}">${i+1}. ${x}</button>`).join('')}</div><div class="sum"><small>ESTIMATION</small><b>${money(R.ttc)}</b><span>${R.ok?'✓ Validable':`⛔ ${blockers.length} blocage(s)`}</span></div></aside><section class="work"><div class="head"><div><small>CHIFFRAGE MÉTIER</small><h1>${steps[S.step]}</h1></div><b>${S.step+1} / 6</b></div>${content(R)}<div class="nav"><button class="btn ghost" data-nav="-1" ${S.step===0?'disabled':''}>← Précédent</button>${S.step<5?'<button class="btn primary" data-nav="1">Continuer →</button>':''}</div><a href="../" class="home">← Retour aux métiers</a></section></main>`;
 bind();

function bind(){
 $('[data-sel="support"]')&&($('[data-sel="support"]').value=S.support);
 $('[data-sel="pose"]')&&($('[data-sel="pose"]').value=S.pose);
 $('[data-sel="comp"]')&&($('[data-sel="comp"]').value=S.comp);
 document.querySelectorAll('[data-step]').forEach(e=>e.onclick=()=>{S.step=+e.dataset.step;render()});

 document.querySelectorAll('[data-sel]').forEach(e=>e.onchange=()=>{S[e.dataset.sel]=e.value;render()});
 document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{S[e.dataset.check]=e.checked;render()});
